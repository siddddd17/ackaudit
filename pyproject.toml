[project]
name = "ackaudit"
version = "0.1.0"
description = "Auditing PyTorch's activation-checkpointing knapsack solvers"
requires-python = ">=3.10"
dependencies = ["torch>=2.10", "networkx", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
hf = ["transformers"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ackaudit*"]

[tool.ruff]
line-length = 100
